[package]
name = "mawaqit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Prayer times applet for COSMIC desktop (Mawaqit مواقيت)"
repository = "https://github.com/doctorit9/cosmic-ext-mawaqit"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52.0", features = ["full"] }
futures = "0.3"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
salah = "0.7"
hijri_date = "0.5"
serde = { version = "1", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
libc = "0.2"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[package.metadata.deb]
name = "cosmic-ext-mawaqit"
maintainer = "doctorit9 <https://github.com/doctorit9>"
copyright = "2026 doctorit9"
extended-description = "Islamic prayer times applet for COSMIC Desktop (Mawaqit مواقيت)"
section = "utils"
priority = "optional"
depends = "$auto, libasound2, libwayland-client0, libxkbcommon0"
assets = [
    ["target/release/mawaqit", "usr/bin/mawaqit", "755"],
    ["resources/app.desktop", "usr/share/applications/io.github.doctorit.mawaqit.desktop", "644"],
    ["resources/app.metainfo.xml", "usr/share/appdata/io.github.doctorit.mawaqit.metainfo.xml", "644"],
    ["resources/icon.svg", "usr/share/icons/hicolor/scalable/apps/io.github.doctorit.mawaqit.svg", "644"],
]

[package.metadata.generate-rpm]
name = "cosmic-ext-mawaqit"
summary = "Islamic prayer times applet for COSMIC Desktop (Mawaqit مواقيت)"
license = "MIT"
assets = [
    { source = "target/release/mawaqit", dest = "/usr/bin/mawaqit", mode = "755" },
    { source = "resources/app.desktop", dest = "/usr/share/applications/io.github.doctorit.mawaqit.desktop", mode = "644" },
    { source = "resources/app.metainfo.xml", dest = "/usr/share/appdata/io.github.doctorit.mawaqit.metainfo.xml", mode = "644" },
    { source = "resources/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.doctorit.mawaqit.svg", mode = "644" },
]

